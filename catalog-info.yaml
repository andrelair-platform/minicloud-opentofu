metadata:
  name: minicloud-opentofu
  description: |
    Phase 11 — OpenTofu (Terraform fork) configuration for MAAS-side
    state. Codifies the cluster subnet, DHCP IP range, five MAAS-managed
    machines, and the explicit non-MAAS swift-mac exception using the
    canonical/maas provider. Brought existing brownfield
    resources under management via tofu import. State is local and gitignored
    (Vault-backed remote state deferred to a future phase), so each operational
    checkout must import the existing MAAS resources before planning changes.
